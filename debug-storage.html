<!DOCTYPE html>
<html>
<head>
    <title>Debug - Vérifier localStorage après redirection</title>
    <style>
        body { font-family: Arial; padding: 50px; background: #f0f0f0; line-height: 1.6; }
        .box { background: white; padding: 20px; margin: 10px 0; border-radius: 5px; border-left: 4px solid #2c3e50; }
        .code { background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 3px; font-family: 'Courier New', monospace; overflow-x: auto; margin: 10px 0; }
        h1 { color: #2c3e50; }
        h2 { color: #34495e; }
        .success { border-left-color: #28a745; background: #d4edda; }
        .error { border-left-color: #dc3545; background: #f8d7da; }
        .warning { border-left-color: #ffc107; background: #fff3cd; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 14px; }
        button:hover { background: #0056b3; }
        button.danger { background: #dc3545; }
        button.danger:hover { background: #c82333; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        table th, table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        table th { background: #ecf0f1; }
    </style>
</head>
<body>
    <h1>🔍 Debug - Vérifier localStorage après redirection</h1>

    <div class="box success">
        <h2>État actuel du stockage</h2>
        <table>
            <tr>
                <th>Emplacement</th>
                <th>Clé</th>
                <th>Valeur</th>
                <th>Taille</th>
            </tr>
            <tbody id="storageTable">
                <tr><td colspan="4">Chargement...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="box">
        <h2>Données currentUser</h2>
        <div id="currentUserData" class="code">Aucune donnée...</div>
    </div>

    <div class="box">
        <h2>Actions</h2>
        <button onclick="checkStorage()">🔄 Rafraîchir les données</button>
        <button onclick="goToLogin()">🔙 Aller au login</button>
        <button class="danger" onclick="clearStorage()">🗑️ Effacer toutes les données</button>
        <button onclick="goToDashboard()">📊 Aller au dashboard</button>
    </div>

    <div class="box">
        <h2>Diagnostic</h2>
        <div id="diagnostics"></div>
    </div>

    <script>
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function checkStorage() {
            console.clear();
            console.log("=== DIAGNOSTIC STORAGE ===");

            // Tableau du stockage
            const table = document.getElementById('storageTable');
            table.innerHTML = '';

            // localStorage
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                const size = new Blob([value]).size;
                table.innerHTML += `
                    <tr>
                        <td><strong>localStorage</strong></td>
                        <td>${key}</td>
                        <td><code style="color: #666;">${value.substring(0, 50)}${value.length > 50 ? '...' : ''}</code></td>
                        <td>${formatBytes(size)}</td>
                    </tr>
                `;
                console.log(`localStorage['${key}']:`, value);
            }

            // sessionStorage
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                const value = sessionStorage.getItem(key);
                const size = new Blob([value]).size;
                table.innerHTML += `
                    <tr>
                        <td><strong>sessionStorage</strong></td>
                        <td>${key}</td>
                        <td><code style="color: #666;">${value.substring(0, 50)}${value.length > 50 ? '...' : ''}</code></td>
                        <td>${formatBytes(size)}</td>
                    </tr>
                `;
                console.log(`sessionStorage['${key}']:`, value);
            }

            if (localStorage.length === 0 && sessionStorage.length === 0) {
                table.innerHTML += '<tr><td colspan="4" style="text-align: center; color: #999;">Aucune donnée stockée</td></tr>';
            }

            // Données currentUser
            const currentUser = localStorage.getItem("currentUser") || sessionStorage.getItem("currentUser");
            const dataDiv = document.getElementById('currentUserData');

            if (currentUser) {
                try {
                    const user = JSON.parse(currentUser);
                    dataDiv.textContent = JSON.stringify(user, null, 2);
                    console.log("currentUser parsé:", user);
                } catch (e) {
                    dataDiv.textContent = "❌ ERREUR: Les données currentUser ne sont pas du JSON valide\n" + currentUser;
                    console.error("Erreur parsing currentUser:", e);
                }
            } else {
                dataDiv.textContent = "❌ Aucune donnée currentUser trouvée";
            }

            // Diagnostic
            runDiagnostics();
        }

        function runDiagnostics() {
            const diagnostics = document.getElementById('diagnostics');
            let html = '';

            // Vérifier localStorage
            try {
                localStorage.setItem('__TEST__', 'test');
                localStorage.removeItem('__TEST__');
                html += '<div class="box success">✓ localStorage fonctionne correctement</div>';
            } catch (e) {
                html += `<div class="box error">✗ localStorage ne fonctionne pas: ${e.message}</div>`;
            }

            // Vérifier sessionStorage
            try {
                sessionStorage.setItem('__TEST__', 'test');
                sessionStorage.removeItem('__TEST__');
                html += '<div class="box success">✓ sessionStorage fonctionne correctement</div>';
            } catch (e) {
                html += `<div class="box error">✗ sessionStorage ne fonctionne pas: ${e.message}</div>`;
            }

            // Vérifier si currentUser existe
            const hasCurrentUser = localStorage.getItem("currentUser") || sessionStorage.getItem("currentUser");
            if (hasCurrentUser) {
                html += '<div class="box success">✓ currentUser existe et est accessible</div>';
            } else {
                html += '<div class="box warning">⚠️ currentUser n\'existe pas. Vous devez vous connecter d\'abord.</div>';
            }

            // Vérifier le cookie
            if (document.cookie.includes('currentUserEmail')) {
                html += '<div class="box success">✓ Cookie currentUserEmail existe</div>';
            } else {
                html += '<div class="box warning">⚠️ Cookie currentUserEmail n\'existe pas</div>';
            }

            diagnostics.innerHTML = html;
        }

        function clearStorage() {
            if (confirm("Êtes-vous sûr de vouloir effacer toutes les données stockées?")) {
                localStorage.clear();
                sessionStorage.clear();
                document.cookie = 'currentUserEmail=; path=/; max-age=0';
                alert("✓ Données effacées!");
                checkStorage();
            }
        }

        function goToLogin() {
            window.location.href = 'index.html';
        }

        function goToDashboard() {
            window.location.href = 'client-dashboard.html';
        }

        // Charger au démarrage
        window.addEventListener('load', checkStorage);

        // Auto-refresh des logs
        console.log("Page de diagnostic chargée");
    </script>
</body>
</html>
