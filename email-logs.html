<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historique des Emails - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #070a0f;
      --green: #00e676;
      --text: #f0f4f8;
      --muted: #8a9bb0;
      --panel: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.07);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
    }

    header {
      padding: 24px 48px;
      border-bottom: 1px solid var(--border);
      background: rgba(7,10,15,0.7);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      color: var(--green);
      font-size: 1.8rem;
    }

    .container-main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
    }

    .btn {
      padding: 10px 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(0,230,118,0.1);
      color: var(--green);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn:hover {
      background: rgba(0,230,118,0.2);
    }

    .email-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      transition: all 0.3s;
    }

    .email-card:hover {
      border-color: var(--green);
      background: rgba(0,230,118,0.05);
    }

    .email-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
    }

    .email-to {
      color: var(--green);
      font-weight: 600;
    }

    .email-timestamp {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .email-type {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .email-type.invoice {
      background: rgba(255,215,64,0.15);
      color: #ffd740;
    }

    .email-type.welcome {
      background: rgba(0,230,118,0.15);
      color: var(--green);
    }

    .email-type.test {
      background: rgba(100,200,255,0.15);
      color: #64c8ff;
    }

    .email-status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-left: 8px;
    }

    .email-status.sent {
      background: rgba(0,230,118,0.15);
      color: var(--green);
    }

    .email-status.failed {
      background: rgba(239,83,80,0.15);
      color: #ef5350;
    }

    .email-subject {
      margin: 12px 0;
      color: var(--text);
      font-size: 1rem;
    }

    .email-content {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 8px;
    }

    .test-form {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--green);
      background: rgba(0,230,118,0.1);
    }

    .msg-box {
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .msg-box.show {
      display: block;
    }

    .msg-box.success {
      background: rgba(0,230,118,0.1);
      border: 1px solid var(--green);
      color: var(--green);
    }

    .msg-box.error {
      background: rgba(239,83,80,0.1);
      border: 1px solid #ef5350;
      color: #ef5350;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>📧 Historique des Emails</h1>
    <button class="btn" onclick="location.href='admin-dashboard.html'" style="background: rgba(255,255,255,0.1); color: var(--text);">
      ← Retour
    </button>
  </header>

  <div class="container-main">
    <div id="message" class="msg-box"></div>

    <div class="test-form">
      <h3 style="color: var(--green); margin-bottom: 20px;">📧 Envoyer un Email de Test</h3>
      <form onsubmit="sendTestEmail(event)">
        <div class="form-group">
          <label>Adresse Email</label>
          <input type="email" id="testEmail" required placeholder="test@example.com">
        </div>
        <div class="form-group">
          <label>Sujet</label>
          <input type="text" id="testSubject" placeholder="Sujet de test" value="Email de Test - FootCamp Dreams">
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea id="testMessage" rows="4" placeholder="Contenu du message">Ceci est un email de test pour vérifier la configuration SMTP.</textarea>
        </div>
        <button type="submit" class="btn">📤 Envoyer</button>
      </form>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 style="margin: 0; color: var(--green); font-size: 1.5rem;">Emails Envoyés</h2>
      <div class="controls">
        <button class="btn" onclick="loadEmailLogs()">🔄 Rafraîchir</button>
        <button class="btn" onclick="filterEmails('all')" id="filterAll">Tous</button>
        <button class="btn" onclick="filterEmails('invoice')" id="filterInvoice">Factures</button>
        <button class="btn" onclick="filterEmails('welcome')" id="filterWelcome">Bienvenue</button>
        <button class="btn" onclick="filterEmails('test')" id="filterTest">Test</button>
      </div>
    </div>

    <div id="emailsContainer" class="loading">
      Chargement...
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    let allEmails = [];
    let currentFilter = 'all';

    $(document).ready(function() {
      loadEmailLogs();
      setInterval(loadEmailLogs, 30000); // Rafraîchir toutes les 30 secondes
    });

    function loadEmailLogs() {
      $.ajax({
        method: 'GET',
        url: 'api/email_logs.php',
        dataType: 'json'
      })
      .done(function(resp) {
        allEmails = resp.emails || [];
        filterEmails(currentFilter);
        showMessage('✅ ' + resp.total + ' emails chargés', 'success');
      })
      .fail(function() {
        showMessage('Erreur de chargement', 'error');
      });
    }

    function filterEmails(type) {
      currentFilter = type;
      
      // Mettre à jour les boutons
      document.querySelectorAll('.controls .btn').forEach(btn => {
        btn.style.background = 'rgba(0,230,118,0.1)';
        btn.style.color = 'var(--green)';
      });

      let filtered = allEmails;
      if (type !== 'all') {
        filtered = allEmails.filter(e => e.type === type);
      }

      displayEmails(filtered);
    }

    function displayEmails(emails) {
      const container = document.getElementById('emailsContainer');
      
      if (emails.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--muted); padding: 40px;">Aucun email trouvé</div>';
        return;
      }

      container.innerHTML = emails.map((email, idx) => {
        const typeLabels = {
          'invoice': 'Facture',
          'welcome': 'Bienvenue',
          'credentials': 'Identifiants',
          'test': 'Test'
        };

        const statusLabel = email.sent ? 'Envoyé ✅' : 'Non envoyé ⚠️';
        const statusClass = email.sent ? 'sent' : 'failed';

        // Afficher un aperçu du contenu ou le corps complet
        const preview = email.body ? email.body.substring(0, 150).replace(/\n/g, ' ') + '...' : (email.message ? email.message.substring(0, 100) : '(pas de contenu)');

        return `
          <div class="email-card">
            <div class="email-header">
              <div>
                <span class="email-type ${email.type}">${typeLabels[email.type] || email.type}</span>
                <span class="email-status ${statusClass}">${statusLabel}</span>
              </div>
              <span class="email-timestamp">${new Date(email.timestamp).toLocaleString('fr-FR')}</span>
            </div>
            <div class="email-to">📧 ${email.to}</div>
            <div class="email-subject">${email.subject}</div>
            <div class="email-content">${preview}</div>
            ${email.reservation_id ? `<div class="email-content"><strong>Réservation:</strong> #${String(email.reservation_id).padStart(6, '0')}</div>` : ''}
            <button onclick="toggleEmailDetails(${idx})" style="margin-top: 10px; padding: 6px 12px; background: rgba(0,230,118,0.15); border: 1px solid var(--green); color: var(--green); border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.85rem;">
              👁️ Voir le contenu
            </button>
            <div id="details-${idx}" style="display: none; margin-top: 15px; padding: 15px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; white-space: pre-wrap; word-break: break-word; font-size: 0.85rem; color: var(--muted); font-family: monospace; max-height: 400px; overflow-y: auto;">
              ${email.body || email.message || '(Pas de contenu)'}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleEmailDetails(idx) {
      const details = document.getElementById('details-' + idx);
      if (details) {
        details.style.display = details.style.display === 'none' ? 'block' : 'none';
      }
    }

    function sendTestEmail(event) {
      event.preventDefault();

      const email = document.getElementById('testEmail').value;
      const subject = document.getElementById('testSubject').value;
      const message = document.getElementById('testMessage').value;

      $.ajax({
        method: 'POST',
        url: 'api/email_logs.php',
        data: {
          email: email,
          subject: subject,
          message: message
        },
        dataType: 'json'
      })
      .done(function(resp) {
        if (!resp.success) {
          showMessage('❌ ' + (resp.message || 'Erreur'), 'error');
        } else {
          showMessage('✅ Email test envoyé à ' + email, 'success');
          document.getElementById('testEmail').value = '';
          setTimeout(loadEmailLogs, 1000);
        }
      })
      .fail(function() {
        showMessage('❌ Erreur lors de l\'envoi', 'error');
      });
    }

    function showMessage(text, type) {
      const msgBox = document.getElementById('message');
      msgBox.textContent = text;
      msgBox.className = 'msg-box show ' + type;
      
      setTimeout(() => {
        msgBox.classList.remove('show');
      }, 5000);
    }
  </script>
</body>
</html>
